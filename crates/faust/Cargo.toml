[package]
name = "faust"
version = "0.1.0"
edition = "2024"
description = "FAUST: Full Annotation Using Shape-constrained Trees — a Rust port of RGLab/FAUST 0.5.5 and RGLab/scamp 0.5.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/tercen/faust_operator"

[dependencies]
thiserror = "1"
rayon = "1"
# Only for the forest subset memo (row masks hashed by content).
ahash = "0.8"

[dev-dependencies]
approx = "0.5"
flate2 = "1"
tar = "0.4"

[lib]
path = "src/lib.rs"
