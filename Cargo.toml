[workspace]
members = ["crates/faust"]

[package]
name = "faust_operator"
version = "1.1.0"
edition = "2024"
description = "FAUST (Full Annotation Using Shape-constrained Trees) for Tercen — Rust port of tercen/faust_operator (R, FAUST 0.5.5 + scamp 0.5.0)"
license = "GPL-3.0-or-later"

[[bin]]
name = "faust_operator"
path = "src/main.rs"

[[bin]]
name = "dev"
path = "src/bin/dev.rs"

[dependencies]
anyhow = "1"
faust = { path = "crates/faust" }

# --- Tercen plumbing (same stack as umap_operator) ---
tercen-rs = { git = "https://github.com/tercen/tercen-rs", branch = "main" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time"] }
tonic = "0.14"
futures = "0.3"
rustson = { git = "https://github.com/tercen/rustson", branch = "master" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tikv-jemallocator = "0.6"
# The annotation embedding (umap_1/umap_2). Pinned to a tag: the coordinates are output.
umaprs = { git = "https://github.com/tercen/umaprs", tag = "0.2.0" }
ndarray = "0.15"
libc = "0.2"
# The threshold histograms (one PNG per selected marker): plotters draws into an RGB buffer
# with an embedded font (fonts/DejaVuSans.ttf, Bitstream Vera licence), png encodes it.
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series"] }
png = "0.17"
base64 = "0.22"
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
